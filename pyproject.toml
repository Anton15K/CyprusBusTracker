[project]
name = "cyprus-bus-tracker-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.11.0",
    "polyline>=2.0.0",
    "protobuf>=5.28.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "tzdata>=2024.1",
    "python-telegram-bot>=21.0",
    "pyjwt>=2.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"backend/app/services/gtfs_realtime_pb2.py" = ["E501"]
